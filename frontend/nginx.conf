server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Fichiers statiques : cache long, immutables (noms hashes par Vite)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Routing SPA : toute route inconnue retombe sur index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
