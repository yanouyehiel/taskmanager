spring.application.name=taskmanager

# --- Base de donnees MySQL ---
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3308}/${DB_NAME:taskmanager}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- JWT ---
app.jwt.secret=${JWT_SECRET:404E635266546A576E5A7234753778214125442A472D4B6150645367566B5970337336763979244226452948404D6351}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Cloud Run injecte PORT ; SERVER_PORT reste utilisable en local/VM
server.port=${PORT:${SERVER_PORT:8080}}

# --- Documentation Swagger / OpenAPI ---
# UI: /swagger-ui.html - Spec JSON: /v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method

# --- Logs ---
logging.level.root=INFO
logging.level.com.yanouyehiel.taskmanager.api=DEBUG
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=${SQL_LOG_LEVEL:WARN}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n
logging.file.name=logs/taskmanager.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=500MB
