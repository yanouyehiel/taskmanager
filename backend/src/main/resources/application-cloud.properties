# Profil actif sur Cloud Run (SPRING_PROFILES_ACTIVE=cloud) : connexion a Cloud SQL
# via le socket factory (pas d'IP/port a exposer, tout passe par le connecteur Cloud SQL).
# Variables requises : CLOUD_SQL_CONNECTION_NAME (project:region:instance), DB_NAME, DB_USERNAME, DB_PASSWORD.
spring.datasource.url=jdbc:mysql:///${DB_NAME}?cloudSqlInstance=${CLOUD_SQL_CONNECTION_NAME}&socketFactory=com.google.cloud.sql.mysql.SocketFactory&useSSL=false
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Filesystem Cloud Run ephemere : on desactive l'ecriture fichier, seul stdout (capte par Cloud Logging) est utilise.
logging.file.name=
